</style><script src="./whitebird-users.js"></script><script src="./whitebird-core.js"></script></head><body><main><header><h1>🥦 作業工具主控台</h1><button id="userButton" data-shion-identity>選擇用戶</button></header><p>長尾山雀工具包 · 精修1108.6（20261108-R6）</p><nav class="tools"><a data-wb-cap="personnel" href="./312-人事系統.html"><b>👥 312 人事系統</b><small>人員清冊與個人資料</small></a><a href="./313-休假預排表.html"><b>🗓️ 313 休假預排表</b><small>精修1108.6 · 效能模式、手機編輯、新版對抗區</small></a><a data-wb-cap="duty" href="./314-值星工具.html"><b>📋 314 值星工具</b><small>勤務排班；新版假表連動暫停</small></a><a data-wb-cap="qr" href="./315-Pale-Echo.html"><b>Pale Echo</b></a><a data-wb-cap="textTransfer" href="./316-Quiet-Tide.html"><b>316 Quiet Tide</b><small>文字快傳</small></a></nav><section data-wb-cap="consoleExport"><h2>資料匯出</h2><button id="consoleExport">全系統匯出</button><p id="consoleExportStatus" role="status"></p></section></main><script>
(function(){const b=document.getElementById('userButton');function sync(){const u=ShionUsers.current();b.textContent=u?u.emoji+' '+u.name:'選擇用戶';}b.onclick=()=>ShionUsers.show();window.addEventListener('shion-user-changed',sync);sync();})();
</script><script>// Read-only export: no writer lease and no duty/identity databases in the backup.
(function(g){'use strict';
const $=id=>document.getElementById(id);let busy=false;
function readDB(name,requests){return new Promise((resolve,reject)=>{
 const req=indexedDB.open(name);let absent=false;
 req.onupgradeneeded=()=>{absent=true;req.transaction.abort();};
 req.onerror=()=>absent?resolve({}):reject(req.error||Error('無法讀取資料'));
 req.onblocked=()=>reject(Error('資料庫使用中，請稍後再試'));
 req.onsuccess=()=>{const db=req.result,names=[...new Set(requests.map(x=>x[0]))].filter(n=>db.objectStoreNames.contains(n)),out={};if(!names.length){db.close();resolve(out);return;}
 const tx=db.transaction(names,'readonly');for(const[store,key,label]of requests){if(!names.includes(store))continue;const r=key===null?tx.objectStore(store).getAll():tx.objectStore(store).get(key);r.onsuccess=()=>{if(r.result!==undefined)out[label]=r.result;};}
 tx.oncomplete=()=>{db.close();resolve(out);};tx.onerror=tx.onabort=()=>{db.close();reject(tx.error||Error('無法讀取資料'));};};
 });}
async function capture(){await WBAccess.ready;WBAccess.assert('consoleExport');
 const [personnel,ops,daily,stops]=await Promise.all([
 readDB('OracleShion:Management',['people','personnelConfig','personnelOrders'].map(n=>[n,null,n])),
 readDB('OracleShion:Planner7:Operations',[['leaveConfig',null,'leaveConfig']]),
 readDB('OracleShion:Planner7:DailyTask',[['workspace','main','daily']]),
 readDB('OracleShion:Planner7:Suspensions',[['workspace','main','suspensions']])]);
 WBAccess.assert('consoleExport');const parts=WBPartitions.split(WBPartitions.readStores(ops));parts[5]=Object.fromEntries(['people','personnelConfig','personnelOrders'].map(n=>[n,personnel[n]||[]]));
 parts[1].workspaces={...parts[1].workspaces,...daily,...stops};return WBPartitions.make(parts,[1,2,3,4,5,6,7,8]);
}
async function run(){if(busy)return;busy=true;const b=$('consoleExport'),status=$('consoleExportStatus');b.disabled=true;try{status.textContent='正在匯出…';const value=await capture();WBAccess.assert('consoleExport');const url=URL.createObjectURL(new Blob([JSON.stringify(value)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='全系統備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='已匯出。';}catch(e){status.textContent=e.message;}finally{busy=false;b.disabled=false;}}
g.WhiteBirdConsole={capture,export:run};$('consoleExport').onclick=run;
})(window);
</script></body></html>
