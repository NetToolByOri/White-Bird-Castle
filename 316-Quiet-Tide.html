<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142536"><title>Quiet Tide</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1521;color:#edf5ff;font:16px/1.5 system-ui}main{max-width:1100px;margin:20px auto;padding:0 14px}header{display:flex;align-items:center;gap:12px}h1{flex:1;font-size:24px;letter-spacing:2px;font-weight:500}a{color:inherit;text-decoration:none}button{font:inherit;border:1px solid #55768e;border-radius:6px;background:#25465b;color:inherit;padding:8px 12px;margin:3px 0;cursor:pointer}button:disabled{opacity:.35}.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}section{padding:14px;border:1px solid #3c566e;border-radius:10px;background:#132536;min-width:0}h2{margin:0 0 8px;font-size:16px}textarea,select{display:block;width:100%;border:1px solid #4a657b;border-radius:6px;background:#091724;color:#f4f8ff;padding:10px;font:15px/1.5 system-ui}textarea{resize:vertical;min-height:190px;white-space:pre-wrap}#scannerText{min-height:60px;height:60px;font:12px monospace;margin-top:8px}select{font-size:12px}#textCodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 0}#textCodes>div{background:white;color:black;text-align:center;padding:4px;min-width:0}#textCodes canvas{width:100%!important;height:auto!important;display:block}small{display:block}#textOutputInfo,#receiveProgress,#textStatus{font-size:13px;overflow-wrap:anywhere;color:#b7d7e6;min-height:1.5em;margin:8px 0}.error{color:#ffb0b0!important}.buttons{display:flex;flex-wrap:wrap;gap:6px}@media(max-width:650px){.panels{grid-template-columns:1fr}main{margin:10px auto}textarea{min-height:150px}}
</style><script src="./whitebird-users.js"></script><script src="./whitebird-core.js"></script></head><body><main><header><h1>Quiet Tide</h1><button data-shion-identity onclick="ShionUsers.show()">登入</button><a href="310-主控台.html" aria-label="返回">↩</a></header><div class="panels"><section><h2>文字</h2><textarea id="sourceText" aria-label="要傳送的文字" spellcheck="false"></textarea><div class="buttons"><button id="prepareText">產生</button><button id="makeTextPDF" disabled>產生檔案</button><button id="downloadTextPDF" disabled>下載</button><button id="openTextPDF" disabled>列印</button></div><div id="textOutputInfo"></div><div id="textCodes"></div></section><section><h2>接收</h2><div class="buttons"><button id="focusScanner">接收</button><button id="receiveNow">送入</button></div><textarea id="scannerText" aria-label="接收框" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><select id="receiveBatch" aria-label="批次"></select><div id="receiveProgress"></div><textarea id="receivedText" aria-label="收到的文字" readonly></textarea><div class="buttons"><button id="copyText" disabled>複製</button><button id="clearBatch" disabled>清除</button></div></section></div><div id="textStatus" role="status"></div></main><script>/* Direct UTF-8 text frames. No archive, compression, or application data access. */
(async function(g){'use strict';
await WBAccess.waitFor('textTransfer');
// Create editable controls after the access overlay releases the parsed page.
// This avoids stale native editor state on Chromium after an inert startup.
for(const id of ['sourceText','scannerText']){const old=document.getElementById(id),fresh=old.cloneNode(true);fresh.value=old.value;old.replaceWith(fresh);}
const MAX=128*1024,CHUNK=480,ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',encoder=new TextEncoder(),decoder=new TextDecoder('utf-8',{fatal:true});
const table=Array.from({length:256},(_,n)=>{for(let i=0;i<8;i++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0;});
function crc(a){let n=0xffffffff;for(const b of a)n=table[(n^b)&255]^(n>>>8);return(n^0xffffffff)>>>0;}
const hex=(n,width)=>n.toString(16).toUpperCase().padStart(width,'0');
function b32(bytes){let bits=0,v=0,s='';for(const b of bytes){v=(v<<8)|b;bits+=8;while(bits>=5){bits-=5;s+=ALPHABET[(v>>>bits)&31];}}if(bits)s+=ALPHABET[(v<<(5-bits))&31];return s;}
function un32(s){if(!/^[A-Z2-7]*$/.test(s))throw Error('內容不正確');let bits=0,v=0,out=[];for(const c of s){v=(v<<5)|ALPHABET.indexOf(c);bits+=5;if(bits>=8){bits-=8;out.push((v>>>bits)&255);}}if(bits&&(v&((1<<bits)-1)))throw Error('內容不完整');const a=Uint8Array.from(out);if(b32(a)!==s)throw Error('內容不完整');return a;}
function encode(text){WBAccess.assert('textTransfer');const bytes=encoder.encode(text);if(!bytes.length)throw Error('請輸入文字');if(bytes.length>MAX)throw Error('文字過長，請分次傳送');const id=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>hex(b,2)).join(''),total=Math.ceil(bytes.length/CHUNK),sum=hex(crc(bytes),8),parts=[];for(let i=0;i<total;i++){const a=bytes.subarray(i*CHUNK,(i+1)*CHUNK);parts.push('TX1'+id+hex(i+1,4)+hex(total,4)+hex(bytes.length,8)+sum+hex(crc(a),8)+b32(a));}return{id,total,size:bytes.length,parts};}
function parse(text){if(typeof text!=='string'||!/^TX1[0-9A-F]{48}[A-Z2-7]+$/.test(text)||text.length>819)throw Error('內容不正確');const id=text.slice(3,19),index=parseInt(text.slice(19,23),16),total=parseInt(text.slice(23,27),16),size=parseInt(text.slice(27,35),16),sum=text.slice(35,43),partSum=text.slice(43,51);if(size<1||size>MAX||total!==Math.ceil(size/CHUNK)||index<1||index>total)throw Error('內容不正確');const bytes=un32(text.slice(51)),expected=index===total?size-CHUNK*(total-1):CHUNK;if(bytes.length!==expected||hex(crc(bytes),8)!==partSum)throw Error('內容不完整');return{id,index,total,size,sum,bytes,source:text};}
const batches=new Map();let active='',output=null,pdfURL=null,pdfBlob=null,generation=0,busy=false,timer,receiveQueue=Promise.resolve();const $=id=>document.getElementById(id),note=(text,error=false)=>{$('textStatus').textContent=text;$('textStatus').classList.toggle('error',error);};
function received(){return batches.get(active);}
function renderReceived(){const select=$('receiveBatch');select.replaceChildren();for(const b of batches.values()){const o=document.createElement('option');o.value=b.id;o.textContent=b.id+' · '+b.parts.size+'/'+b.total;select.append(o);}select.value=active;const b=received();$('receiveProgress').textContent=b?b.parts.size+'／'+b.total:'';$('receivedText').value=b?.text??'';$('copyText').disabled=b?.text===undefined;$('clearBatch').disabled=!b;}
function collect(text){WBAccess.assert('textTransfer');const p=parse(text);let b=batches.get(p.id);if(!b){if(batches.size>=10)throw Error('請先清除舊批次');b={id:p.id,total:p.total,size:p.size,sum:p.sum,parts:new Map()};batches.set(p.id,b);}if(b.total!==p.total||b.size!==p.size||b.sum!==p.sum)throw Error('批次內容不一致');const old=b.parts.get(p.index);if(old&&old.source!==p.source)throw Error('重複內容不一致');b.parts.set(p.index,p);active=b.id;if(b.parts.size===b.total&&b.text===undefined){const all=new Uint8Array(b.size);for(let i=1;i<=b.total;i++)all.set(b.parts.get(i).bytes,(i-1)*CHUNK);try{if(hex(crc(all),8)!==b.sum)throw Error('完整性檢查未通過，請重新接收');b.text=decoder.decode(all);}catch(e){b.parts.clear();renderReceived();throw e;}}renderReceived();return{duplicate:!!old,complete:b.text!==undefined,id:b.id};}
function enqueue(lines){receiveQueue=receiveQueue.then(()=>{for(const line of lines){try{const r=collect(line.trim());note(r.complete?'完成':r.duplicate?'已接收':'接收中');}catch(e){note(e.message,true);}}});return receiveQueue;}
function flush(){clearTimeout(timer);const lines=$('scannerText').value.split(/\r\n|\r|\n/).filter(x=>x.trim());$('scannerText').value='';return enqueue(lines);}
function changed(){clearTimeout(timer);const el=$('scannerText');if(el.value.length>200000){el.value='';note('內容過長',true);return;}if(/[\r\n]/.test(el.value)){const lines=el.value.split(/\r\n|\r|\n/);el.value=lines.pop();enqueue(lines.filter(x=>x.trim()));}timer=setTimeout(()=>{try{parse(el.value.trim());flush();}catch{}},250);}
function disposePDF(){if(pdfURL)URL.revokeObjectURL(pdfURL);pdfURL=null;pdfBlob=null;$('downloadTextPDF').disabled=$('openTextPDF').disabled=true;}
async function prepare(){await WBAccess.ready;WBAccess.assert('textTransfer');const run=++generation;disposePDF();output=null;$('textCodes').replaceChildren();$('textOutputInfo').textContent='';$('makeTextPDF').disabled=true;const item=encode($('sourceText').value);await WhiteBird.load('qrcode.min.js','QRCode');WBAccess.assert('textTransfer');if(run!==generation)return;output=item;$('textOutputInfo').textContent=item.id+' · '+item.total+'張／'+Math.ceil(item.total/6)+'頁';for(let i=0;i<item.total;i++){const tile=document.createElement('div'),canvas=document.createElement('canvas');await QRCode.toCanvas(canvas,item.parts[i],{errorCorrectionLevel:'M',margin:4,scale:3});if(run!==generation)return;WBAccess.assert('textTransfer');const label=document.createElement('small');label.textContent=(i+1)+'／'+item.total;tile.append(canvas,label);$('textCodes').append(tile);if(i%6===5)await new Promise(r=>setTimeout(r,0));}$('makeTextPDF').disabled=false;note('完成');}
async function makePDF(){await WBAccess.ready;WBAccess.assert('textTransfer');if(!output||busy)return;busy=true;const item=output,run=generation;$('makeTextPDF').disabled=true;try{await WhiteBird.load('jspdf.umd.min.js','jspdf');const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',compress:true});pdf.setProperties({title:item.id,subject:'',author:'',creator:'',keywords:''});for(let i=0;i<item.total;i++){WBAccess.assert('textTransfer');if(run!==generation)throw Error('已停止');if(i%6===0){if(i)pdf.addPage();pdf.setFontSize(10);pdf.text(item.id+'   '+item.total+'   '+(Math.floor(i/6)+1)+'/'+Math.ceil(item.total/6),14,14);}const canvas=document.createElement('canvas');await QRCode.toCanvas(canvas,item.parts[i],{errorCorrectionLevel:'M',margin:4,scale:8});const x=i%2?117:17,y=25+Math.floor((i%6)/2)*86;pdf.addImage(canvas.toDataURL('image/png'),'PNG',x,y,76,76,undefined,'FAST');pdf.setFontSize(9);pdf.text((i+1)+'/'+item.total,x+38,y+79,{align:'center'});if(i%6===5)await new Promise(r=>setTimeout(r,0));}WBAccess.assert('textTransfer');if(run!==generation)return;disposePDF();pdfBlob=pdf.output('blob');pdfURL=URL.createObjectURL(pdfBlob);$('downloadTextPDF').disabled=$('openTextPDF').disabled=false;note('完成');}finally{busy=false;$('makeTextPDF').disabled=!output;}}
function download(){WBAccess.assert('textTransfer');if(!pdfURL||!output)return;const a=document.createElement('a');a.href=pdfURL;a.download=output.id+'.pdf';a.click();}
async function copy(){WBAccess.assert('textTransfer');const text=received()?.text;if(text===undefined)return;try{await navigator.clipboard.writeText(text);note('已複製');}catch{const el=$('receivedText');el.focus();el.select();if(document.execCommand('copy'))note('已複製');else note('請複製已選取的文字');}}
function run(fn){return()=>Promise.resolve().then(fn).catch(e=>note(e.message,true));}
$('prepareText').onclick=run(prepare);$('makeTextPDF').onclick=run(makePDF);$('downloadTextPDF').onclick=run(download);$('openTextPDF').onclick=run(()=>{WBAccess.assert('textTransfer');if(pdfURL)g.open(pdfURL,'_blank','noopener');});$('sourceText').oninput=()=>{generation++;output=null;disposePDF();$('makeTextPDF').disabled=true;$('textCodes').replaceChildren();$('textOutputInfo').textContent='';};
$('scannerText').oninput=changed;$('scannerText').onkeydown=e=>{if(e.isComposing)return;if(e.key==='Enter'||e.key==='Tab'){if(e.currentTarget.value){e.preventDefault();flush();}}};$('receiveNow').onclick=run(flush);$('focusScanner').onclick=run(()=>{WBAccess.assert('textTransfer');$('scannerText').focus();});$('receiveBatch').onchange=()=>{active=$('receiveBatch').value;renderReceived();};$('copyText').onclick=run(copy);$('clearBatch').onclick=run(()=>{WBAccess.assert('textTransfer');if(!confirm('清除此批內容？'))return;batches.delete(active);active=[...batches.keys()].at(-1)||'';renderReceived();});
g.addEventListener('whitebird-access-changed',()=>{if(!WBAccess.can('textTransfer')){generation++;output=null;disposePDF();$('makeTextPDF').disabled=true;clearTimeout(timer);$('scannerText').value='';$('textCodes').replaceChildren();}});
g.PaleText={encode,parse,collect,prepare,makePDF,flush,get output(){return output},get batches(){WBAccess.assert('textTransfer');return batches},get pdf(){WBAccess.assert('textTransfer');return pdfBlob},MAX,CHUNK};
})(window);
</script></body></html>
