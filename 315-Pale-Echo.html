<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142536"><title>Pale Echo</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1521;color:#e9f2fc;font:16px/1.5 system-ui}main{max-width:800px;margin:30px auto;padding:0 16px}header{display:flex;gap:12px;align-items:center;justify-content:space-between}h1{font-size:25px;font-weight:500;letter-spacing:3px}a{color:#c7d8e9;text-decoration:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:35px 0}button,.choose{font:inherit;padding:10px 17px;background:#213d53;border:1px solid #58748e;border-radius:7px;color:inherit;cursor:pointer}button:disabled{opacity:.4}.choose input{position:absolute;width:1px;height:1px;opacity:0}.choose:focus-within{outline:2px solid white}#status,#zipInfo{color:#b4c9da;font-size:14px;white-space:pre-wrap}.error{color:#ffb8b8!important}[hidden]{display:none!important}
</style><script src="./whitebird-users.js"></script><script src="./whitebird-core.js"></script></head><body><main><header><h1>Pale Echo</h1><button data-shion-identity onclick="ShionUsers.show()">登入</button><a href="310-主控台.html" aria-label="返回">↩</a></header><div class="actions"><label class="choose">選擇檔案<input id="zipFile" type="file" accept=".zip,application/zip"></label><button id="zipExport" disabled>產生檔案</button><button id="zipImport">接收</button></div><div id="zipInfo"></div><div id="status" role="status"></div></main><script>
(function(){'use strict';const $=id=>document.getElementById(id);let file,busy=false;const load=()=>WhiteBird.load('shion-qr.js','ShionQR');
$('zipFile').onchange=e=>{file=e.target.files[0];$('zipExport').disabled=!file;$('zipInfo').textContent=file?(file.size/1024).toFixed(1)+' KB':'';$('status').textContent='';};
async function open(mode){await WBAccess.ready;WBAccess.assert('qr');if(busy||mode==='export-zip'&&!file)return;busy=true;$('zipExport').disabled=true;try{await load();WBAccess.assert('qr');await ShionQR.open(mode,file);$('status').textContent='';}catch(e){$('status').textContent='無法完成';$('status').className='error';}finally{busy=false;$('zipExport').disabled=!file;}}
$('zipExport').onclick=()=>open('export-zip');$('zipImport').onclick=()=>open('import-zip');})();
</script></body></html>
